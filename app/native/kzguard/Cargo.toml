[package]
name = "kzguard"
version = "3.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3", optional = true }
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader",
  "Win32_System_Environment", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation", "Win32_System_Kernel",
]

[build-dependencies]
napi-build = { version = "2", optional = true }

[features]
default = ["node"]
node = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
