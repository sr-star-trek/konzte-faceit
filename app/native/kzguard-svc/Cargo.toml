[package]
name = "kzguard-svc"
version = "1.1.4"
edition = "2021"
publish = false
description = "KONZTE GUARD — standalone anti-cheat for Konzte Faceit (Windows service + tray)"
build = "build.rs"

[[bin]]
name = "KonzteGuard"
path = "src/main.rs"

[dependencies]
kzguard = { path = "../kzguard", default-features = false }
serde_json = "1"
ed25519-dalek = { version = "2.1", default-features = false }
sha2 = "0.10"
base64 = "0.22"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
  "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Console",
  "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Networking_WinHttp", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
